<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDPR Records</title>
</head>
<body>

  <nav>
    <a href="index.html">Records</a>
    <a href="login.html">Login</a>
    <a href="my-data.html">My Data</a>
    <a href="consents.html">Consents</a>
    <a href="admin.html">Admin</a> <!-- TODO: show only for admin role -->
    <a href="privacy.html">Privacy</a>
  </nav>

  <h1>Records</h1>

  <div id="error-message"></div>

  <section>
    <a href="record-form.html">
      <button type="button">+ Add Record</button>
    </a>
  </section>

  <section>
    <label for="search-input">Search</label>
    <input
      type="text"
      id="search-input"
      placeholder="Search by name, email, purpose..."
    />
  </section>

  <section>
    <label for="export">EXPORT</label>
    <input
            type="text"
            id="export"
            placeholder="export by ID"
    />
  </section>


  <section>
    <table border="1">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Purpose</th>
          <th>Created at</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="records-table-body">
        <tr>
          <td colspan="6">Loading...</td>
        </tr>
      </tbody>
    </table>
  </section>

  <section id="pagination">
    <button type="button" id="prev-btn">Previous</button>
    <span id="page-info">Page 1</span>
    <button type="button" id="next-btn">Next</button>
  </section>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/records.js"></script>

</body>
</html>
